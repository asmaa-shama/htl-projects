<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VocabTrain</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="./bootstrap-5.3.3-dist/css/bootstrap.css" />
    <link href="./bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet" />
  </head>
  <body onload="loadSets()">
    <div class="container my-4">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div class="d-flex align-items-center gap-2" style="width: 80%; max-width: 600px;">
          <div class="input-group">
            <span class="input-group-text" id="basic-addon1"><i class="bi bi-search"></i></span>
            <input
              type="text"
              id="searchTitle"
              class="form-control"
              placeholder="Search: Title"
              aria-describedby="basic-addon1"
            />
          </div>

          <select id="filterSort" class="form-select" style="width: min-content;">
            <option value="title_asc">A → Z</option>
            <option value="title_desc">Z → A</option>
          </select>
        </div>

        <div>
          <button
            id="btnCreateSet"
            class="btn btn-success d-flex align-items-center gap-2"
            onclick="location.href = 'create-set.html'"
          >
            <i class="bi bi-plus-circle"></i> Create Set
          </button>
        </div>
      </div>

      <div id="setsList" class="row"></div>
      <div id="noData" class="text-center text-muted mt-5" style="display: none">
        No VocabSets Found.
      </div>
    </div>
    <script src="client.js"></script>
  </body>
</html>
